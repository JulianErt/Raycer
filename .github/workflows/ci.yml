# Informative CI (QA-40); the local gate scripts/check.sh decides merges.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Quality gate
        run: bash scripts/check.sh
        env:
          RAYCER_MIN_SPS: "100"
      - name: Build
        run: uv build
      - name: Smoke install wheel
        run: |
          uv venv .smoke-venv
          uv pip install --python .smoke-venv dist/*.whl
          uv run --no-project --python .smoke-venv python -c "import raycer"
          uv run --no-project --python .smoke-venv raycer --version

  slow:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --all-extras --group dev
      - name: Slow tests
        run: uv run pytest -m slow
        env:
          SDL_VIDEODRIVER: dummy
